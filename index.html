<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Character Explorer</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="loading" class="loading-overlay">
            <div class="spinner-border text-light" role="status"></div>
            <span class="ms-3">Loading...</span>
        </div>

        <main class="container py-5">
            <header class="text-center mb-5 text-white">
                <h1 class="display-4 fw-bold">Homework №3</h1>
                <p class="lead opacity-75">
                    Rick & Morty API + Factory Pattern
                </p>
            </header>

            <div id="characters-list" class="row g-4"></div>

            <nav class="pagination-container mt-5">
                <button id="prev-btn" class="btn-custom">
                    <i class="fas fa-chevron-left"></i> Prev
                </button>
                <span id="page-info" class="text-center">Сторінка 1</span>
                <button id="next-btn" class="btn-custom">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </nav>
        </main>
        <div
            class="modal fade"
            id="characterModal"
            tabindex="-1"
            aria-hidden="true"
        >
            <div class="modal-dialog modal-dialog-centered text-dark">
                <div
                    class="modal-content border-0 shadow-lg"
                    style="border-radius: 20px; overflow: hidden"
                >
                    <div class="modal-header border-0 pb-0">
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div
                        class="modal-body text-center p-4"
                        id="modal-body-content"
                    ></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <script src="main.js"></script>
    </body>
</html>
